<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Préférences de Magic Threads</title>
  <style>
    /* Suivre le thème de Thunderbird : les couleurs système (Canvas/CanvasText)
       s'adaptent automatiquement au mode clair comme au mode sombre. */
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.875rem;
      color: var(--in-content-page-color, CanvasText);
      background-color: var(--in-content-page-background, Canvas);
      padding: 1.25rem;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 25%, Canvas));
      padding-bottom: 0.625rem;
    }
    /* Les groupes de radios sont des <fieldset> (sémantique a11y) : neutraliser
       le rendu natif pour conserver la mise en page d'origine. */
    fieldset.option-group {
      border: none;
      padding: 0;
      margin: 0 0 25px;
      min-width: 0;
    }
    legend.option-group-title {
      font-weight: bold;
      margin-bottom: 10px;
      padding: 0;
    }
    .option-row {
      margin-bottom: 12px;
    }
    label {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }
    input[type="radio"] {
      margin-right: 10px;
      margin-top: 3px;
    }
    input[type="radio"]:focus-visible {
      outline: 2px solid var(--in-content-focus-outline-color, #0060df);
      outline-offset: 2px;
    }
    .description {
      margin-top: 4px;
      /* Gris dérivé du thème : lisible sur fond clair comme sombre */
      color: color-mix(in srgb, CanvasText 65%, Canvas);
      font-size: 0.75rem;
      padding-left: 24px;
    }
    .status-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      color: #00702f;
      background-color: color-mix(in srgb, #00702f 8%, Canvas);
      border: 1px solid color-mix(in srgb, #00702f 35%, Canvas);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .status-msg.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    /* Bandeau d'alerte quand Gloda est indisponible (3.5) */
    .warning-banner {
      margin-bottom: 20px;
      padding: 10px 14px;
      border: 1px solid #c08a00;
      border-inline-start-width: 4px;
      border-radius: 4px;
      background-color: #fff3cd;
      color: #5c4400;
    }
    @media (prefers-color-scheme: dark) {
      .status-msg {
        color: #54d196;
        background-color: color-mix(in srgb, #54d196 15%, Canvas);
        border-color: color-mix(in srgb, #54d196 40%, Canvas);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .warning-banner {
        background-color: #46350a;
        color: #ffd97a;
        border-color: #8a6d1f;
      }
    }
    .links-summary-card {
      padding: 14px 16px;
      border-radius: 8px;
      background-color: color-mix(in srgb, CanvasText 4%, Canvas);
      border: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 20%, Canvas));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .links-summary-text {
      font-size: 0.875rem;
      color: var(--in-content-page-color, CanvasText);
    }
    .links-summary-count {
      font-weight: 600;
    }
    .open-manager-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      background-color: #0060df;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .open-manager-btn:hover {
      background-color: #003eaa;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .open-manager-btn:focus-visible {
      outline: 2px solid var(--in-content-focus-outline-color, #0060df);
      outline-offset: 2px;
    }
    @media (prefers-color-scheme: dark) {
      .open-manager-btn {
        background-color: #0060df;
      }
      .open-manager-btn:hover {
        background-color: #0050bc;
      }
    }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <!-- Alerte affichée si l'index Gloda est désactivé ou absent (rempli par options.js) -->
  <div id="gloda-warning" class="warning-banner" role="alert" hidden></div>

  <fieldset class="option-group">
    <legend class="option-group-title" data-i18n="optNavGroupTitle"></legend>

    <div class="option-row">
      <label for="nav-mode-current">
        <input type="radio" id="nav-mode-current" name="navigationMode" value="currentTab" aria-describedby="nav-mode-current-desc" checked>
        <strong data-i18n="optNavCurrentTabLabel"></strong>
      </label>
      <div id="nav-mode-current-desc" class="description" data-i18n="optNavCurrentTabDesc"></div>
    </div>
    
    <div class="option-row">
      <label for="nav-mode-new">
        <input type="radio" id="nav-mode-new" name="navigationMode" value="newTab" aria-describedby="nav-mode-new-desc">
        <strong data-i18n="optNavNewTabLabel"></strong>
      </label>
      <div id="nav-mode-new-desc" class="description" data-i18n="optNavNewTabDesc"></div>
    </div>
  </fieldset>

  <fieldset class="option-group">
    <legend class="option-group-title" data-i18n="optSidebarGroupTitle"></legend>

    <div class="option-row">
      <label for="sidebar-pos-right">
        <input type="radio" id="sidebar-pos-right" name="sidebarPosition" value="right" aria-describedby="sidebar-pos-right-desc" checked>
        <strong data-i18n="optSidebarRight"></strong>
      </label>
      <div id="sidebar-pos-right-desc" class="description" data-i18n="optSidebarRightDesc"></div>
    </div>
    
    <div class="option-row">
      <label for="sidebar-pos-left">
        <input type="radio" id="sidebar-pos-left" name="sidebarPosition" value="left" aria-describedby="sidebar-pos-left-desc">
        <strong data-i18n="optSidebarLeft"></strong>
      </label>
      <div id="sidebar-pos-left-desc" class="description" data-i18n="optSidebarLeftDesc"></div>
    </div>
  </fieldset>

  <fieldset class="option-group">
    <legend class="option-group-title" data-i18n="optMainViewGroupTitle"></legend>

    <div class="option-row">
      <label for="main-view-pos-bottom">
        <input type="radio" id="main-view-pos-bottom" name="mainViewPosition" value="bottom" aria-describedby="main-view-pos-bottom-desc" checked>
        <strong data-i18n="optMainViewBottom"></strong>
      </label>
      <div id="main-view-pos-bottom-desc" class="description" data-i18n="optMainViewBottomDesc"></div>
    </div>
    
    <div class="option-row">
      <label for="main-view-pos-right">
        <input type="radio" id="main-view-pos-right" name="mainViewPosition" value="right" aria-describedby="main-view-pos-right-desc">
        <strong data-i18n="optMainViewRight"></strong>
      </label>
      <div id="main-view-pos-right-desc" class="description" data-i18n="optMainViewRightDesc"></div>
    </div>

  </fieldset>

  <fieldset class="option-group" aria-describedby="thread-order-desc">
    <legend class="option-group-title" data-i18n="optThreadOrderTitle"></legend>
    <div id="thread-order-desc" class="description" style="padding-left: 0; margin-bottom: 12px;" data-i18n="optThreadOrderDesc"></div>

    <div class="option-row">
      <label for="thread-order-antichrono">
        <input type="radio" id="thread-order-antichrono" name="threadOrder" value="antichronological" checked>
        <strong data-i18n="optThreadOrderAntichrono"></strong>
      </label>
    </div>
    
    <div class="option-row">
      <label for="thread-order-chrono">
        <input type="radio" id="thread-order-chrono" name="threadOrder" value="chronological">
        <strong data-i18n="optThreadOrderChrono"></strong>
      </label>
    </div>
  </fieldset>

  <fieldset class="option-group" aria-describedby="manual-links-desc">
    <legend class="option-group-title" data-i18n="optManualLinksGroupTitle"></legend>
    <div id="manual-links-desc" class="description" style="padding-left: 0; margin-bottom: 12px;" data-i18n="optManualLinksDesc"></div>

    <div class="links-summary-card">
      <div class="links-summary-text">
        <span id="manual-links-count-text">...</span>
      </div>
      <a href="links.html" class="open-manager-btn" id="open-links-manager-btn" target="_blank" rel="noopener noreferrer">
        <span data-i18n="optManualLinksBtnOpenManager"></span>
        <span aria-hidden="true">↗</span>
      </a>
    </div>
  </fieldset>

  <!-- Zone de feedback « préférences enregistrées » : role="status" (aria-live
       implicite) ; le texte est inséré à l'enregistrement pour être annoncé. -->
  <div id="status" class="status-msg" role="status"></div>

  <script src="options.js"></script>
</body>
</html>
