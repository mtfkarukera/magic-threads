<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Préférences de Magic Threads</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: var(--in-content-page-color, #222);
      background-color: var(--in-content-page-background, #fff);
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--in-content-border-color, #ccc);
      padding-bottom: 10px;
    }
    .option-group {
      margin-bottom: 25px;
    }
    .option-group-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .option-row {
      margin-bottom: 12px;
    }
    label {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }
    input[type="radio"] {
      margin-right: 10px;
      margin-top: 3px;
    }
    .description {
      margin-top: 4px;
      color: #666;
      font-size: 12px;
      padding-left: 24px;
    }
    .status-msg {
      margin-top: 15px;
      font-weight: 600;
      color: #007a3d;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .status-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>
  
  <div class="option-group">
    <div class="option-group-title" data-i18n="optNavGroupTitle"></div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="navigationMode" value="currentTab" checked>
        <strong data-i18n="optNavCurrentTabLabel"></strong>
      </label>
      <div class="description" data-i18n="optNavCurrentTabDesc"></div>
    </div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="navigationMode" value="newTab">
        <strong data-i18n="optNavNewTabLabel"></strong>
      </label>
      <div class="description" data-i18n="optNavNewTabDesc"></div>
    </div>
  </div>

  <div class="option-group">
    <div class="option-group-title" data-i18n="optSidebarGroupTitle"></div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="sidebarPosition" value="right" checked>
        <strong data-i18n="optSidebarRight"></strong>
      </label>
      <div class="description" data-i18n="optSidebarRightDesc"></div>
    </div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="sidebarPosition" value="left">
        <strong data-i18n="optSidebarLeft"></strong>
      </label>
      <div class="description" data-i18n="optSidebarLeftDesc"></div>
    </div>
  </div>

  <div class="option-group">
    <div class="option-group-title" data-i18n="optMainViewGroupTitle"></div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="mainViewPosition" value="bottom" checked>
        <strong data-i18n="optMainViewBottom"></strong>
      </label>
      <div class="description" data-i18n="optMainViewBottomDesc"></div>
    </div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="mainViewPosition" value="right">
        <strong data-i18n="optMainViewRight"></strong>
      </label>
      <div class="description" data-i18n="optMainViewRightDesc"></div>
    </div>
    
  </div>

  <div class="option-group">
    <div class="option-group-title" data-i18n="optThreadOrderTitle"></div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="threadOrder" value="antichronological" checked>
        <strong data-i18n="optThreadOrderAntichrono"></strong>
      </label>
      <div class="description" data-i18n="optThreadOrderDesc"></div>
    </div>
    
    <div class="option-row">
      <label>
        <input type="radio" name="threadOrder" value="chronological">
        <strong data-i18n="optThreadOrderChrono"></strong>
      </label>
    </div>
  </div>

  <div id="status" class="status-msg" data-i18n="optStatusSaved"></div>

  <script src="options.js"></script>
</body>
</html>
