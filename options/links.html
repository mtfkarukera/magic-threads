<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title data-i18n="linksPageTitle">Gestionnaire des fils associés manuellement</title>
  <style>
    /* Suivre fidèlement le thème de Thunderbird Supernova :
       les couleurs système (Canvas/CanvasText) et tokens s'adaptent
       automatiquement en mode clair comme en mode sombre. */
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.875rem;
      color: var(--in-content-page-color, CanvasText);
      background-color: var(--in-content-page-background, Canvas);
      padding: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .back-nav {
      margin-bottom: 1.25rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--in-content-link-color, light-dark(#0060df, #63aaff));
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }
    .back-link:hover {
      background-color: color-mix(in srgb, CanvasText 8%, transparent);
      text-decoration: underline;
    }
    .back-link:focus-visible {
      outline: 2px solid var(--in-content-focus-outline-color, light-dark(#0060df, #63aaff));
      outline-offset: 2px;
    }
    header.page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 25%, Canvas));
      padding-bottom: 0.875rem;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }
    .badge-counter {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      background-color: color-mix(in srgb, CanvasText 10%, Canvas);
      color: var(--in-content-page-color, CanvasText);
      border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 250px;
    }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px 8px 32px;
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--in-content-page-color, CanvasText);
      background-color: var(--in-content-box-background, Canvas);
      border: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 25%, Canvas));
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus,
    .search-input:focus-visible {
      outline: 2px solid var(--in-content-focus-outline-color, light-dark(#0060df, #63aaff));
      outline-offset: 0;
      border-color: var(--in-content-focus-outline-color, light-dark(#0060df, #63aaff));
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: color-mix(in srgb, CanvasText 60%, Canvas);
      display: flex;
      align-items: center;
    }
    #links-table-container {
      overflow-x: auto;
    }
    table.links-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.875rem;
      background-color: var(--in-content-box-background, Canvas);
      border: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 20%, Canvas));
      border-radius: 6px;
      overflow: hidden;
    }
    table.links-table th, table.links-table td {
      border-bottom: 1px solid var(--in-content-border-color, color-mix(in srgb, CanvasText 15%, Canvas));
      padding: 10px 14px;
      text-align: left;
      vertical-align: middle;
    }
    table.links-table th {
      background-color: color-mix(in srgb, CanvasText 6%, Canvas);
      font-weight: 600;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: color-mix(in srgb, CanvasText 85%, Canvas);
    }
    table.links-table tbody tr:hover {
      background-color: color-mix(in srgb, CanvasText 4%, Canvas);
    }
    .cell-title {
      font-weight: 600;
      color: var(--in-content-page-color, CanvasText);
      display: block;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cell-author {
      display: block;
      font-size: 0.8125rem;
      color: color-mix(in srgb, CanvasText 65%, Canvas);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scope-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: color-mix(in srgb, #0060df 12%, Canvas);
      color: var(--in-content-link-color, #0060df);
      border: 1px solid color-mix(in srgb, #0060df 30%, Canvas);
      white-space: nowrap;
    }
    .scope-badge.single {
      background-color: color-mix(in srgb, CanvasText 8%, Canvas);
      color: var(--in-content-page-color, CanvasText);
      border-color: color-mix(in srgb, CanvasText 20%, Canvas);
    }
    .date-cell {
      white-space: nowrap;
      font-size: 0.8125rem;
      color: color-mix(in srgb, CanvasText 75%, Canvas);
    }
    .action-cell {
      text-align: center;
      width: 48px;
    }
    .delete-link-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 4px;
      color: #d70022;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .delete-link-btn:hover:not(:disabled) {
      background-color: rgba(215, 0, 34, 0.12);
      transform: scale(1.08);
    }
    .delete-link-btn:active:not(:disabled) {
      transform: scale(0.95);
    }
    .delete-link-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .delete-link-btn:focus-visible {
      outline: 2px solid var(--in-content-focus-outline-color, light-dark(#0060df, #63aaff));
      outline-offset: 2px;
    }
    .empty-notice {
      padding: 2.5rem 1rem;
      text-align: center;
      font-style: italic;
      color: color-mix(in srgb, CanvasText 65%, Canvas);
      background-color: color-mix(in srgb, CanvasText 3%, Canvas);
      border: 1px dashed var(--in-content-border-color, color-mix(in srgb, CanvasText 20%, Canvas));
      border-radius: 6px;
    }
    .status-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      color: #00702f;
      background-color: color-mix(in srgb, #00702f 8%, Canvas);
      border: 1px solid color-mix(in srgb, #00702f 35%, Canvas);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .status-msg.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    @media (prefers-color-scheme: dark) {
      .scope-badge {
        background-color: color-mix(in srgb, #528bff 18%, Canvas);
        color: #79a8ff;
        border-color: color-mix(in srgb, #528bff 45%, Canvas);
      }
      .delete-link-btn {
        color: #ff6961;
      }
      .delete-link-btn:hover:not(:disabled) {
        background-color: rgba(255, 105, 97, 0.18);
      }
      .status-msg {
        color: #54d196;
        background-color: color-mix(in srgb, #54d196 15%, Canvas);
        border-color: color-mix(in srgb, #54d196 40%, Canvas);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .back-link,
      .search-input,
      .delete-link-btn,
      .status-msg {
        transition: none !important;
      }
      .delete-link-btn:hover:not(:disabled),
      .delete-link-btn:active:not(:disabled),
      .status-msg,
      .status-msg.show {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <nav class="back-nav">
    <a href="options.html" class="back-link" id="back-link">
      <span aria-hidden="true">←</span>
      <span data-i18n="linksPageBackToOptions"></span>
    </a>
  </nav>

  <header class="page-header">
    <h1 data-i18n="linksPageTitle"></h1>
    <div id="links-counter" class="badge-counter" aria-live="polite" aria-atomic="true"></div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true" id="search-icon-placeholder"></span>
        <input type="search" id="search-input" class="search-input" data-i18n-placeholder="linksPageSearchPlaceholder" data-i18n-aria-label="linksPageSearchPlaceholder" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div id="links-table-container">
      <!-- Rempli dynamiquement et de manière sécurisée par links.js -->
    </div>
  </main>

  <div id="status" class="status-msg" role="status"></div>

  <script src="links.js"></script>
</body>
</html>
